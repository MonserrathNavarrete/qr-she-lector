
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171923">
  <title>QR-SHE 2.0 | Lector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #11131b;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      background: #1d202b;
      border: 1px solid #343847;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
    }

    .marca {
      color: #b69cff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 28px;
    }

    .descripcion {
      color: #b6bac8;
      font-size: 14px;
      line-height: 1.5;
    }

    .estado {
      margin: 25px 0;
      padding: 15px;
      border-radius: 12px;
      background: #292d3a;
      color: #d7d9e2;
      font-size: 14px;
    }

    .indicador {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
      background: #e8b65d;
    }

    .nota {
      margin-top: 25px;
      color: #858b9c;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <div class="marca">CONTROL DE PERSONAL</div>

    <h1>QR-SHE 2.0</h1>

    <p class="descripcion">
      Sistema de control de entradas y salidas de personal de obra.
    </p>

    <div class="estado">
      <span class="indicador"></span>
      Interfaz inicial creada correctamente.
    </div>

    <p class="descripcion">
      Próximamente: lector de credenciales QR.
    </p>

    <div class="nota">
      SHE · SEGURIDAD, HIGIENE Y MEDIO AMBIENTE
    </div>
  </main>
</body>
</html>
